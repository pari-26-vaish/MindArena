<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MindArena — Sign Up</title>

    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="stylesheet" href="../CSS/theme.css" />
    <link rel="stylesheet" href="../CSS/signup.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <script src="../JS/app.js" defer></script>
    <script src="../JS/signup.js" defer></script>
  </head>

  <body>
    <main class="signup-page">
      <div class="signup-container">
        <!-- Logo -->
        <div class="logo-container">
          <div class="mindarena-text">
            <span class="mind">Mind</span><span class="arena">Arena</span>
          </div>
        </div>

        <!-- Header -->
        <div class="signup-header">
          <h1>Create Account</h1>
          <p>Join the MindArena and start competing.</p>
        </div>

        <!-- Signup Form -->
        <form id="signup-form">
          <div class="signup-field">
            <label for="username">Username</label>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Choose a username"
              autocomplete="username"
              required
            />
          </div>

          <div class="signup-field">
            <label for="email">Email</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>

          <div class="signup-field">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="signup-field">
            <label for="confirm-password">Confirm Password</label>

            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
            />
          </div>

          <div id="signup-error"></div>

          <button type="submit" class="signup-btn">Create Account →</button>
        </form>

        <!-- Login -->
        <p class="login-text">
          Already have an account?
          <a href="login.html">Login</a>
        </p>

        <!-- Home -->
        <a href="../index.html" class="back-home"> ← Back to Home </a>
      </div>
    </main>
  </body>
</html>
