<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindArena</title>
    <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico" />

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/leaderboard.css" />
    <link rel="stylesheet" href="../CSS/theme.css" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Playwrite+NZ+Basic:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="../JS/app.js" defer></script>
    <script src="../JS/leaderboard.js" defer></script>
  </head>
  <body>
    <nav id="navbar">
      <a href="../index.html" class="logo">
        <img src="../assets/icons/logo-icon.png" alt="MindArena" />
        <span class="logo-text">
          <span class="logo-mind">Mind</span
          ><span class="logo-arena">Arena</span>
        </span>
      </a>
      <ul>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <a href="../index.html">Home</a>
        </li>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <a href="../pages/categories.html">Categories</a>
        </li>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <a href="../pages/leaderboard.html">Leaderboard</a>
        </li>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <a href="../pages/dashboard.html">Dashboard</a>
        </li>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <button id="theme-btn">☀️</button>
        </li>
      </ul>
    </nav>
    <!-- Leaderboard page content goes here. -->
    <main class="leaderboard-page">
      <div class="lb-header">
        <span class="badge">🏆 Top Minds</span>
        <h1>Leaderboard</h1>
        <p>See who's conquering the arena. Play more quizzes to climb up.</p>
      </div>

      <div class="lb-controls">
        <select id="categoryFilter">
          <option value="all">All Categories</option>
          <option value="Programming">Programming</option>
          <option value="Science">Science</option>
          <option value="Geography">Geography</option>
          <option value="History">History</option>
          <option value="Sports">Sports</option>
          <option value="Movies">Movies</option>
        </select>
        <button id="clearScores" class="btn-outline">Clear My Scores</button>
      </div>

      <div id="podium" class="podium"></div>

      <table class="lb-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Category</th>
            <th>Score</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="lbTableBody"></tbody>
      </table>

      <p id="emptyState" class="empty-state" style="display: none">
        No scores yet. Play a quiz to appear on the leaderboard!
      </p>
    </main>
  </body>
</html>
