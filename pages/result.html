<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindArena</title>
    <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico" />

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/result.css" />
    <link rel="stylesheet" href="../CSS/theme.css" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Playwrite+NZ+Basic:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="../JS/app.js" defer></script>
    <script src="../JS/result.js" defer></script>
  </head>

  <body>
    <nav id="navbar">
      <a href="../index.html" class="logo">
        <img src="../assets/icons/logo-icon.png" alt="MindArena" />
        <span class="logo-text">
          <span class="logo-mind">Mind</span
          ><span class="logo-arena">Arena</span>
        </span>
      </a>
      <ul>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <a href="../index.html">Home</a>
        </li>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <a href="../pages/categories.html">Categories</a>
        </li>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <a href="../pages/leaderboard.html">Leaderboard</a>
        </li>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <a href="../pages/dashboard.html">Dashboard</a>
        </li>
        <li style="font-size: 20px; font-weight: bold; align-items: center">
          <button id="theme-btn">☀️</button>
        </li>
      </ul>
    </nav>

    <!-- Result panel -->
    <section class="result-section">
      <div class="result-card">
        <div class="result-header">
          <h1>🎉 Quiz Completed!</h1>
          <p id="result-msg">Great Job!</p>
        </div>

        <div class="score-circle">
          <h2 id="score">8 / 10</h2>
          <span>Final Score</span>
        </div>
        <div class="divider"></div>
        <div class="stats">
          <div class="stat">
            <span>📈 Accuracy</span>
            <strong id="accuracy">80%</strong>
          </div>

          <div class="stat">
            <span>⚡ XP Earned</span>
            <strong id="xp">+160</strong>
          </div>
        </div>

        <div class="result-buttons">
          <a href="categories.html" class="primary-btn"> 🔄 Play Again </a>

          <a href="../index.html" class="secondary-btn"> 🏠 Home </a>
        </div>
      </div>
    </section>
  </body>
</html>
